{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="auth-card__mark"><i class="fa-solid fa-cloud-sun-rain"></i></div>
  <h1>Welcome back</h1>
  <p class="auth-card__lede">Log in to check your farm's drought risk.</p>

  <form method="POST" class="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required placeholder="••••••••">

    <button type="submit" class="btn btn--primary"><i class="fa-solid fa-right-to-bracket"></i> Log in</button>
  </form>

  <p class="auth-card__foot">No account yet? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
</section>
{% endblock %}
